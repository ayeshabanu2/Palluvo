name: Scheduled Rate Limit Cleanup

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cleanup Endpoint
        if: env.APP_URL != ''
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -s -X POST "${APP_URL}/api/cron/prune-rate-limits" \
            -H "Authorization: Bearer ${CRON_SECRET}"
